# ───────────────────────────────────────────────────────────────
# 生产 profile —— SQL Server 版
#
# 部署前把本文件覆盖到后端源码再打包：
#   cp deploy/application-prod.yml src/main/resources/application-prod.yml
#   mvn package -DskipTests
#
# 同时确保 pom.xml 已加入 mssql-jdbc 依赖（见 deploy/README.md）。
# MyBatis-Plus 会根据 JDBC URL/驱动自动识别 SQL Server 方言（分页等），无需手动指定 dbType。
# ───────────────────────────────────────────────────────────────
spring:
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    # encrypt=true + trustServerCertificate=true：SQL Server on Linux 默认自签证书时需要。
    # 若使用受信任证书，请去掉 trustServerCertificate 或设为 false。
    url: jdbc:sqlserver://${DB_HOST}:${DB_PORT:1433};databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      max-lifetime: 1800000

logging:
  level:
    root: WARN
    com.laikuang.archive: INFO
  file:
    name: /opt/lkda/logs/archive.log
