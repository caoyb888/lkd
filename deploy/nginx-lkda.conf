# ───────────────────────────────────────────────────────────────
# 莱矿-档案管理系统 · Nginx 站点配置
# 安装:
#   sudo cp deploy/nginx-lkda.conf /etc/nginx/sites-available/lkda
#   sudo ln -sf /etc/nginx/sites-available/lkda /etc/nginx/sites-enabled/lkda
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# ★ 把所有 your.domain.com 替换成真实域名（deploy.sh / 手动 sed 均可）
# ★ 证书：先跑 deploy/setup-tls.sh 申请，再启用本配置（443 依赖证书文件存在）
# ───────────────────────────────────────────────────────────────

# 后端上游
upstream lkda_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ── HTTP(80)：ACME 校验 + 强制跳转 HTTPS ───────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name your.domain.com;

    # Let's Encrypt 续期校验（webroot）
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS(443)：前端静态 + /api 反代 ───────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your.domain.com;

    # ── TLS（由 setup-tls.sh / certbot 生成）──────────────────
    ssl_certificate     /etc/letsencrypt/live/your.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your.domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── 安全响应头 ─────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ★ 上传上限：后端 multipart max-file-size=100MB，否则大文件返回 413
    client_max_body_size 100m;

    # ── 前端静态资源（Vite 构建产物）──────────────────────────
    root /var/www/lkda;
    index index.html;

    # 带哈希指纹的静态资源长缓存
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 后端 API（注意：后端 context-path 就是 /api，前缀保留不剥离）──
    location /api/ {
        proxy_pass http://lkda_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    300s;   # 大文件导入/导出留足时间
        proxy_send_timeout    300s;
    }

    # ── 已上传原文文件：独立目录，只读对外 ─────────────────────
    # 实际访问建议经后端鉴权下载；如需 Nginx 直出，去掉 internal 并自行控权
    location /files/ {
        alias /data/lkda-uploads/;
        internal;
        expires 7d;
    }

    # ── gzip ───────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/woff2;

    access_log /var/log/nginx/lkda.access.log;
    error_log  /var/log/nginx/lkda.error.log;
}
